[platformio]
default_envs = esp32s3_cardputer

[env:esp32p4_pioarduino]
; Pin to pioarduino 55.03.35 (Arduino core 3.3.5 / ESP-IDF 5.5.1) to
; avoid the Tab5 MIPI-DSI backlight flicker regression.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.35
board = esp32-p4-evboard
framework = arduino

; Debugging-Einstellungen
;debug_tool = esp-builtin
;debug_init_break = tbreak setup
;build_type = debug

upload_speed = 1500000
monitor_speed = 115200
build_type = release

board_build.mcu = esp32p4
board_build.flash_mode = qio

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_TAB5
    -DAUDIO_KEEP_WARM=0
    -DLOG_SERIAL=0
    -O3
    -ffunction-sections
    -fdata-sections
    -fno-rtti
    -fno-exceptions
    -funroll-loops
    -ffast-math

lib_deps =
    https://github.com/M5Stack/M5Unified.git
    https://github.com/M5Stack/M5GFX.git

[env:esp32s3_cardputer]
; Pin pioarduino 55.03.311 (Arduino core 3.3.11 / ESP-IDF 5.5.5). The
; 3.3.7 release added "fix(ble): Make BLE memory management automatic"
; (#12287) and 3.3.9 added "feat(bt): Add BT memory tracking and
; wrapping" (#12574). Both target the heap pressure that surfaced as
; `esp_nimble_hci_init() failed; err=257` on the Cardputer ADV when
; running on 3.3.5. Keep the sdkconfig override as a safety net.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.311
board = esp32-s3-devkitc-1
framework = arduino

upload_speed = 1500000
monitor_speed = 115200
build_type = release

; Robust native-USB (TinyUSB) upload. In ARDUINO_USB_MODE=0 the running
; app is a TinyUSB-OTG device; esptool's auto-reset switches the shared
; USB PHY to the USB-Serial-JTAG ROM controller (VID:PID 303a:1001),
; which enumerates as a DIFFERENT serial port than the app's CDC0. Without
; this, esptool keeps waiting on the old (now-gone) port and fails with
; "No serial data received". wait_for_upload_port makes PlatformIO rescan
; and follow the new bootloader port that appears after the reset.
board_upload.wait_for_upload_port = yes
board_upload.require_upload_port  = yes

; esptool reset modes for native USB. --before=usb_reset uses esptool's
; USB-Serial-JTAG reset (it does not depend on the running app's DTR/RTS
; handler, so it works from a running firmware). --after=hard_reset
; restarts after flashing. If a second upload still won't enter the
; bootloader, put the board in download mode manually (see docs/connecting.md)
; and it will flash regardless.
upload_flags =
    --before=usb_reset
    --after=hard_reset

; USB: TinyUSB composite device with TWO CDC interfaces.
;   CDC0 -> Arduino `Serial`  = firmware upload + `pio device monitor`
;           + debug logging (Log.h). Unchanged developer workflow.
;   CDC1 -> WinkeySerial       = WinKeyer 2.x byte stream a host logger
;           (e.g. RUMlogNG on macOS) opens as a second serial port.
; One USB-C cable therefore enumerates as two /dev/cu.usbmodem* ports.
;
; ARDUINO_USB_MODE=0 selects TinyUSB (USB-OTG); =1 would be the fixed
; hardware USB-Serial-JTAG (single CDC, no composite). CFG_TUD_CDC=2
; raises the TinyUSB CDC interface count so a second USBCDC instance can
; be created. See docs/winkey.md § 4.4 / § 16 for the transport design.
build_flags =
    -DBOARD_CARDPUTER
    -DCORE_DEBUG_LEVEL=4
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DCFG_TUD_CDC=2
    -DAUDIO_KEEP_WARM=0
    -DLOG_SERIAL=1
    -O3
    -ffunction-sections
    -fdata-sections

lib_deps =
    https://github.com/M5Stack/M5GFX.git
    M5Cardputer=https://github.com/m5stack/M5Cardputer

; post: build firmware-merged.bin for the web flasher (see merge_bin.py).
extra_scripts =
    post:scripts/merge_bin.py


