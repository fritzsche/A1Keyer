[platformio]
default_envs = esp32s3_cardputer

[env:esp32p4_pioarduino]
; Pin to pioarduino 55.03.35 (Arduino core 3.3.5 / ESP-IDF 5.5.1) to
; avoid the Tab5 MIPI-DSI backlight flicker regression.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.35
board = esp32-p4-evboard
framework = arduino

; Debugging-Einstellungen
;debug_tool = esp-builtin
;debug_init_break = tbreak setup
;build_type = debug

upload_speed = 1500000
monitor_speed = 115200
build_type = release

board_build.mcu = esp32p4
board_build.flash_mode = qio

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_TAB5
    -DAUDIO_KEEP_WARM=0
    -DLOG_SERIAL=0
    -O3
    -ffunction-sections
    -fdata-sections
    -fno-rtti
    -fno-exceptions
    -funroll-loops
    -ffast-math

lib_deps =
    https://github.com/M5Stack/M5Unified.git
    https://github.com/M5Stack/M5GFX.git

[env:esp32s3_cardputer]
; Pin pioarduino 55.03.311 (Arduino core 3.3.11 / ESP-IDF 5.5.5). The
; 3.3.7 release added "fix(ble): Make BLE memory management automatic"
; (#12287) and 3.3.9 added "feat(bt): Add BT memory tracking and
; wrapping" (#12574). Both target the heap pressure that surfaced as
; `esp_nimble_hci_init() failed; err=257` on the Cardputer ADV when
; running on 3.3.5. Keep the sdkconfig override as a safety net.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.311
board = esp32-s3-devkitc-1
framework = arduino

upload_speed = 1500000
monitor_speed = 115200
build_type = release

; USB: single hardware USB-Serial-JTAG port (ARDUINO_USB_MODE=1). This is
; the normal ESP32-S3 flashing path — `pio run -t upload` and
; `pio device monitor` work with no manual bootloader dance and no
; port-switch fragility.
;
; ARDUINO_USB_CDC_ON_BOOT=0 keeps `Serial` aliased to `Serial0` (UART0),
; which means the framework's `printBeforeSetupInfo()` does NOT touch the
; USB-Serial-JTAG peripheral during early boot — it leaves the peripheral
; in its ROM-emitted JTAG state and the Mac's CDC driver gets a clean
; enumeration when the device powers up. We then bring up our own
; HWCDC instance for CDC RX/TX inside `Console::begin()`, called from
; setup() AFTER M5.begin() has settled pin ownership (see
; src/console_io.cpp). This avoids the macOS enumeration race that
; happens when CDC is brought up before M5 has a chance to claim pins
; (the Mac's CDC driver would otherwise end up bound to a stale
; descriptor after the framework's peripheral-manager pin dance).
;
; For WinKeyer RX to work the CDC peripheral must be initialized; with
; CDC_ON_BOOT=0 there is no global `HWCDCSerial` instance, so we
; instantiate our own `HWCDC` in console_io.cpp and route all Console
; I/O through it. Framework `log_*` calls still flow via the chip's
; default ets_putc2 path (UART0 TX → USB-Serial-JTAG mirror), which is
; independent of our CDC TX and cannot corrupt a WinKey session.
;
; That single serial port serves TWO runtime modes, toggled by the 'D'
; key (see src/console_io.h):
;   Console mode (default) — normal debug serial (Log.h).
;   WinKey mode            — the port speaks the WinKeyer WK2 protocol for
;                            a host logger (RUMlogNG). Debug output is
;                            buffered while in WinKey mode and replayed on
;                            return, so it never corrupts the binary stream.
; See docs/connecting.md and docs/winkey.md § 4.4.
build_flags =
    -DBOARD_CARDPUTER
    -DCORE_DEBUG_LEVEL=4
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DAUDIO_KEEP_WARM=0
    -DLOG_SERIAL=1
    -O3
    -ffunction-sections
    -fdata-sections

lib_deps =
    https://github.com/M5Stack/M5GFX.git
    M5Cardputer=https://github.com/m5stack/M5Cardputer

; pre:  auto-enable ENABLE_WIFI_DEBUG when src/secrets.h exists (local-only
;       opt-in; the file is git-ignored so toggling is purely local).
; post: build firmware-merged.bin for the web flasher (see merge_bin.py).
extra_scripts =
    pre:scripts/wifi_debug_auto.py
    post:scripts/merge_bin.py


